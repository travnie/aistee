name: Android + KMP CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Build Android, test shared & lint
        # roborazzi.test.record: the unit-test run also writes JVM screenshots (ScreenshotTest).
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug \
            :shared:desktopTest -Proborazzi.test.record=true --stacktrace

      - name: Upload JVM screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aistee-screenshots-jvm
          path: app/build/outputs/roborazzi/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aistee-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      # Between the compact and wide test runs: install the debug app, cold-start it and
      # screenshot both widths (out/ is uploaded with the reports).
      - name: Run Android 16 compact and wide smoke tests
        uses: ./.github/actions/run-android-emulator
        with:
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=ais.tee.TestExpandedWidth --stacktrace
            mkdir -p out
            ./gradlew :app:installDebug --stacktrace
            adb shell pm clear ais.tee
            adb shell am start -S -W -n ais.tee/.MainActivity
            sleep 8
            adb exec-out screencap -p > out/app-compact.png
            adb shell wm size 1280x800
            adb shell wm density 240
            sleep 4
            adb exec-out screencap -p > out/app-wide.png
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.annotation=ais.tee.TestExpandedWidth --stacktrace

      - name: Upload Android smoke test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-smoke-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            out/
          retention-days: 7
