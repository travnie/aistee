name: Sync generated Baseline Profile

on:
  push:
    branches:
      - fix/webview-trim-memory-policy
    paths:
      - .github/workflows/sync-generated-baseline-profile.yml

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/webview-trim-memory-policy

      - name: Download generated profile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10479995350/zip" \
            --output /tmp/aistee-baseline-profile.zip
          rm -rf /tmp/aistee-profile
          mkdir -p /tmp/aistee-profile
          unzip -q /tmp/aistee-baseline-profile.zip -d /tmp/aistee-profile

      - name: Sync profiles and remove one-shot workflow
        run: |
          cp /tmp/aistee-profile/release/generated/baselineProfiles/baseline-prof.txt \
            app/src/release/generated/baselineProfiles/baseline-prof.txt
          cp /tmp/aistee-profile/release/generated/baselineProfiles/startup-prof.txt \
            app/src/release/generated/baselineProfiles/startup-prof.txt
          rm .github/workflows/sync-generated-baseline-profile.yml

      - name: Commit generated profiles
        run: |
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add \
            app/src/release/generated/baselineProfiles/baseline-prof.txt \
            app/src/release/generated/baselineProfiles/startup-prof.txt \
            .github/workflows/sync-generated-baseline-profile.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "perf: refresh baseline profiles"
          git push origin HEAD:fix/webview-trim-memory-policy
