name: Import generated profiles once

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-profiles-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  import-profiles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Restore validated generated profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aistee-profile"
          mkdir -p "$work"
          gh run download 35768588143 --repo "$GITHUB_REPOSITORY" \
            --name aistee-baseline-profile --dir "$work"
          cp "$work/release/generated/baselineProfiles/baseline-prof.txt" \
            app/src/release/generated/baselineProfiles/baseline-prof.txt
          cp "$work/release/generated/baselineProfiles/startup-prof.txt" \
            app/src/release/generated/baselineProfiles/startup-prof.txt

      - name: Commit profiles and remove helper
        run: |
          set -euo pipefail
          git config user.name "gptomek[bot]"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git rm .github/workflows/import-profiles-once.yml
          git add app/src/release/generated/baselineProfiles/baseline-prof.txt \
                  app/src/release/generated/baselineProfiles/startup-prof.txt
          git commit -m "perf: refresh JSON5 baseline profiles"
          git push origin "HEAD:${{ github.head_ref }}"
