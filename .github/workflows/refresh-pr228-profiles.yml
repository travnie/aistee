name: Refresh PR 228 baseline profiles

on: # yamllint disable-line rule:truthy
  push:
    branches: [fix/webview-trim-memory-policy]
    paths:
      - ".github/workflows/refresh-pr228-profiles.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/webview-trim-memory-policy
          fetch-depth: 0

      - name: Download generated profile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/travnie/aistee/actions/artifacts/10479995350/zip" \
            --output /tmp/aistee-profile.zip
          rm -rf /tmp/aistee-profile
          mkdir -p /tmp/aistee-profile
          unzip -q /tmp/aistee-profile.zip -d /tmp/aistee-profile
          cp /tmp/aistee-profile/release/generated/baselineProfiles/baseline-prof.txt \
            app/src/release/generated/baselineProfiles/baseline-prof.txt
          cp /tmp/aistee-profile/release/generated/baselineProfiles/startup-prof.txt \
            app/src/release/generated/baselineProfiles/startup-prof.txt

      - name: Commit refreshed profiles and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-pr228-profiles.yml
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles/baseline-prof.txt \
                  app/src/release/generated/baselineProfiles/startup-prof.txt \
                  .github/workflows/refresh-pr228-profiles.yml
          git commit -m "perf: refresh baseline profiles"
          git push origin HEAD:fix/webview-trim-memory-policy
