name: Android performance verification

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "app/src/main/**"
      - "shared/src/commonMain/**"
      - "shared/src/androidMain/**"
      - "app/src/**/baselineProfiles/**"
      - "gradle/libs.versions.toml"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/performance-ci.yml"
      - ".github/actions/setup-android-build/**"
      - ".github/actions/run-android-emulator/**"
  # PRs only pay for the emulator when performance infrastructure or startup
  # entry points change. Broad app/shared coverage still runs after merge on main.
  pull_request:
    branches: [main]
    paths:
      - "benchmark/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/ais/tee/AisteeApplication.kt"
      - "app/src/main/java/ais/tee/MainActivity.kt"
      - "app/src/**/baselineProfiles/**"
      - "gradle/libs.versions.toml"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/performance-ci.yml"
      - ".github/actions/setup-android-build/**"
      - ".github/actions/run-android-emulator/**"

concurrency:
  group: performance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Verify Baseline Profile and Macrobenchmark journeys
        uses: ./.github/actions/run-android-emulator
        with:
          script: |
            ./gradlew :app:generateBaselineProfile -Pandroidx.baselineprofile.forceonlyconnecteddevices -Pandroid.testInstrumentationRunnerArguments.class=ais.tee.benchmark.BaselineProfileGenerator -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace
            ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ais.tee.benchmark.StartupBenchmark,ais.tee.benchmark.ProviderSwitchBenchmark,ais.tee.benchmark.NativeChatBenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --stacktrace

      - name: Upload performance test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aistee-performance-test-reports
          path: |
            benchmark/build/outputs/androidTest-results/**
            benchmark/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated Baseline Profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aistee-baseline-profile
          path: app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error

      - name: Check generated Aistee profile coverage is current
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          def canonical_rules(text: str) -> list[str]:
              rules = set()
              for line in text.splitlines():
                  if "Lais/tee/" not in line:
                      continue
                  rule = re.sub(r"^[HSP]+", "", line)
                  # Compose/Kotlin can renumber compiler-generated lambdas between
                  # equivalent profile runs. Compare only stable app methods.
                  if "->" not in rule:
                      continue
                  if (
                      "$ExternalSyntheticLambda" in rule
                      or "$lambda$" in rule
                      or "$inlined$" in rule
                  ):
                      continue
                  rules.add(rule)
              return sorted(rules)

          def committed_profile_paths(startup: bool) -> list[pathlib.Path]:
              names = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", "HEAD", "app/src"],
                  text=True,
              ).splitlines()
              return [
                  pathlib.Path(name)
                  for name in names
                  if "/baselineProfiles/" in name
                  and name.endswith(".txt")
                  and name.endswith("/startup-prof.txt") == startup
              ]

          def committed_rules(startup: bool) -> set[str]:
              rules = set()
              for path in committed_profile_paths(startup):
                  committed = subprocess.check_output(
                      ["git", "show", f"HEAD:{path.as_posix()}"],
                      text=True,
                  )
                  rules.update(canonical_rules(committed))
              return rules

          stale = False
          generated_root = pathlib.Path("app/src/release/generated/baselineProfiles")
          for name, startup in (("baseline-prof.txt", False), ("startup-prof.txt", True)):
              path = generated_root / name
              expected_rules = committed_rules(startup)
              generated_rules = set(canonical_rules(path.read_text()))
              missing = sorted(generated_rules - expected_rules)
              if missing:
                  stale = True
                  print(
                      f"::error::{name} is missing {len(missing)} generated Aistee rules "
                      "across committed profile sources"
                  )
                  for rule in missing:
                      print(f"+{rule}")
              extra = expected_rules - generated_rules
              if extra:
                  print(
                      f"::notice::{name} keeps {len(extra)} additional stable Aistee rules "
                      "not observed in this run"
                  )

          if stale:
              print(
                  "::error::Regenerate Baseline Profiles and commit the updated "
                  "app/src/release/generated/baselineProfiles/*.txt files "
                  "(see docs/android-performance.md)"
              )
              sys.exit(1)
