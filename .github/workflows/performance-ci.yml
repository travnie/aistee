name: Android performance verification

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/performance-ci.yml"

concurrency:
  group: performance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Restore generated profiles from validated run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aistee-profile"
          mkdir -p "$work"
          gh run download 35743234543 --repo "$GITHUB_REPOSITORY" \
            --name aistee-baseline-profile --dir "$work"
          cp "$work/release/generated/baselineProfiles/baseline-prof.txt" \
            app/src/release/generated/baselineProfiles/baseline-prof.txt
          cp "$work/release/generated/baselineProfiles/startup-prof.txt" \
            app/src/release/generated/baselineProfiles/startup-prof.txt

      - name: Commit refreshed profiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTomek"
          git config user.email "314538226+gptomek[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles/baseline-prof.txt \
                  app/src/release/generated/baselineProfiles/startup-prof.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: refresh direct reply profiles"
          git push origin "HEAD:${{ github.head_ref }}"
