name: CodeQL (Android and Actions)

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      include: ${{ steps.scope.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test scope selector
        run: python3 -m unittest discover -s .github/scripts -p test_codeql_matrix.py
      - name: Select languages
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/codeql_matrix.py >> "$GITHUB_OUTPUT"

  analyze:
    needs: select
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.required && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}

    steps:
      - name: No affected code for this language
        if: ${{ !matrix.required }}
        run: echo 'CodeQL scan not needed for this change.'
      - name: Checkout
        if: matrix.required
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Android toolchain
        if: matrix.required && matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-android-build
        with:
          gradle-cache-disabled: "true"

      - name: Initialize CodeQL
        if: matrix.required
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Organization policy comes from travnie/.github via github-codeql-config-file.
      # Kotlin needs a real JDK 21 build, but CodeQL only needs compiled test code:
      # run actual tests separately in Android + KMP CI to avoid flaky test failures.
      - name: Compile Android, tests and benchmark Kotlin
        if: matrix.required && matrix.language == 'java-kotlin'
        run: |
          ./gradlew :app:assembleDebug :app:compileDebugUnitTestKotlin \
            :benchmark:assemble :shared:desktopTestClasses --no-daemon --stacktrace

      - name: Analyze
        if: matrix.required
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: "/language:${{ matrix.language }}"
