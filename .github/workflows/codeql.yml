name: CodeQL (Android and Actions)

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Android toolchain
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-android-build
        with:
          gradle-cache-disabled: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Organization policy comes from travnie/.github via github-codeql-config-file.
      # Kotlin needs a real JDK 21 build, but CodeQL only needs compiled test code:
      # run actual tests separately in Android + KMP CI to avoid flaky test failures.
      - name: Compile Android, tests and benchmark Kotlin
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew :app:assembleDebug :app:compileDebugUnitTestKotlin \
            :benchmark:assemble :shared:desktopTestClasses --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
