name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "gradlew"
      - "app/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-android-build/**"
  workflow_dispatch:

concurrency:
  group: aistee-rolling-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish rolling release
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::app/build.gradle.kts has no versionName."
            exit 1
          fi
          version_code="$GITHUB_RUN_NUMBER"
          if [ "$version_code" -lt 1 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "::error::GITHUB_RUN_NUMBER is outside the Google Play versionCode range."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
        with:
          gradle-cache-disabled: "true"

      - name: Validate signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false
          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        env:
          AISTEE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AISTEE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AISTEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AISTEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AISTEE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and name release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          grep -F "versionName='$RELEASE_VERSION'" <<< "$badging"
          grep -F "versionCode='$RELEASE_VERSION_CODE'" <<< "$badging"
          aab_files="$RUNNER_TEMP/aab-files.txt"
          unzip -Z1 "$aab" > "$aab_files"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$aab_files"
          jarsigner -verify "$aab" >/dev/null

          cp "$apk" dist/aistee.apk
          cp "$aab" dist/aistee.aab

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="aistee-latest"
          stage="aistee-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id=""
          old_id=""
          old_ref_sha=""
          old_deleted=false
          backup_dir="$RUNNER_TEMP/aistee-rolling-backup"
          old_notes="$RUNNER_TEMP/aistee-rolling-notes.md"
          old_name="Aistee · rolling"
          old_prerelease=false

          release_id_for_tag() {
            local wanted="$1" attempt output
            for attempt in 1 2 3; do
              if output="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$wanted\") | .id" 2>&1)" \
                && [ -n "$output" ]; then
                printf '%s\n' "$output"
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep "$attempt"
            done
            printf '%s\n' "$output" >&2
            return 1
          }

          wait_for_absent_release_and_tag() {
            local wanted="$1" deadline
            deadline=$((SECONDS + 60))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! gh api "repos/$GH_REPO/releases/tags/$wanted" >/dev/null 2>&1 \
                && ! gh api "repos/$GH_REPO/git/ref/tags/$wanted" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          cleanup_failed_promotion() {
            status=$?
            trap - EXIT
            set +e

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            echo "::warning::Rolling release promotion failed; cleaning staging state."

            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 || true
            else
              if staged_id="$(release_id_for_tag "$stage")" && [ -n "$staged_id" ]; then
                gh api --method DELETE "repos/$GH_REPO/releases/$staged_id" >/dev/null 2>&1 || true
              fi
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true

            if [ "$old_deleted" = true ]; then
              gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
              if [ -s "$backup_dir/aistee.apk" ] && [ -s "$backup_dir/aistee.aab" ]; then
                restore_args=(
                  "$tag"
                  "$backup_dir/aistee.apk"
                  "$backup_dir/aistee.aab"
                  --target "$old_ref_sha"
                  --title "$old_name"
                  --notes-file "$old_notes"
                  --latest
                )
                if [ "$old_prerelease" = true ]; then
                  restore_args+=(--prerelease)
                fi
                if ! gh release create "${restore_args[@]}" >/dev/null 2>&1; then
                  echo "::error::Could not restore the previous rolling release automatically."
                  echo "::error::Previous target was $old_ref_sha; use the saved main build if manual recovery is required."
                fi
              else
                echo "::error::Previous rolling assets were not preserved; manual recovery may be required."
              fi
            fi

            exit "$status"
          }
          trap cleanup_failed_promotion EXIT

          printf 'Signed Android builds from `%s`.\n\nRolling release. Assets are replaced after each successful build of `main`.\nApp version: `%s`.\n' \
            "$GITHUB_SHA" "$RELEASE_VERSION" > release-notes.md

          gh release create "$stage" dist/aistee.apk dist/aistee.aab \
            --draft --target "$GITHUB_SHA" \
            --title "Aistee · rolling" --notes-file release-notes.md
          release_id="$(release_id_for_tag "$stage")"
          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve the staged draft release."
            exit 1
          fi

          asset_count="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq 'length')"
          test "$asset_count" -eq 2

          if old_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>/dev/null)"; then
            if ! old_ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              echo "::error::Existing rolling release has no matching git tag."
              exit 1
            fi

            mkdir -p "$backup_dir"
            gh release download "$tag" --dir "$backup_dir" \
              --pattern 'aistee.apk' --pattern 'aistee.aab'
            test -s "$backup_dir/aistee.apk"
            test -s "$backup_dir/aistee.aab"
            gh api "repos/$GH_REPO/releases/$old_id" --jq '.body // ""' > "$old_notes"
            old_name="$(gh api "repos/$GH_REPO/releases/$old_id" --jq '.name // "Aistee · rolling"')"
            old_prerelease="$(gh api "repos/$GH_REPO/releases/$old_id" --jq '.prerelease')"

            old_deleted=true
            gh release delete "$tag" --cleanup-tag --yes
            if ! wait_for_absent_release_and_tag "$tag"; then
              echo "::error::Previous rolling release or tag did not disappear within 60 seconds."
              exit 1
            fi
          fi

          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name='Aistee · rolling' -F draft=false -F prerelease=false \
            -f make_latest=true >/dev/null

          tag_synced=false
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if promoted_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)" \
              && [ "$promoted_sha" = "$GITHUB_SHA" ]; then
              tag_synced=true
              break
            fi
            sleep 2
          done
          if [ "$tag_synced" != true ]; then
            echo "::error::Promoted rolling tag did not resolve to $GITHUB_SHA within 60 seconds."
            exit 1
          fi

          final_asset_count="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets | length')"
          test "$final_asset_count" -eq 2
          trap - EXIT
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true
