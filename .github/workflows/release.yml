name: Release

# main -> rolling release `aistee-latest` (aistee.apk); tag vX.Y -> versioned release (aistee_X.Y.apk).
# One serialized publication queue; allocate versionCode above all published builds.
on: # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    # Main push caller requires all Android CI jobs to succeed.
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Only eligible jobs enter the publication queue; no valid run is evicted.
    concurrency:
      group: aistee-rolling-release
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILT_SHA: ${{ github.sha }}
      VERIFIED_CI: ${{ (github.event_name == 'push' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILT_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Select release scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=true
          if [ "$VERIFIED_CI" = true ]; then
            lookup_err="$RUNNER_TEMP/release-scope.err"
            if published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/aistee-latest" --jq 'if .draft then "" else (.id | tostring) end' 2>"$lookup_err")"; then
              if [ -n "$published" ]; then
                old_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/aistee-latest" --jq .object.sha)"
                git cat-file -e "$old_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$old_sha"
                if git diff --quiet "$old_sha" "$BUILT_SHA" -- gradlew app/ shared/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ .github/workflows/release.yml .github/actions/setup-android-build/; then
                  required=false
                fi
              fi
            elif ! grep -q 'HTTP 404' "$lookup_err"; then
              cat "$lookup_err" >&2
              exit 1
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        if: steps.scope.outputs.required == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::app/build.gradle.kts has no versionName."
            exit 1
          fi
          kind=rolling
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            kind=versioned
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version (expected v$version)."
              exit 1
            fi
            # Only releases cut from main: the commit must be main itself or behind it.
            compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BUILT_SHA" --jq .status)"
            if [ "$compare" != "identical" ] && [ "$compare" != "behind" ]; then
              echo "::error::Tagged commit is not on main (compare status: $compare)."
              exit 1
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          # Queue arrival and run-number order may differ. Use published version metadata
          # as a floor; old releases predate the marker, so retain the run-number baseline.
          set -o pipefail
          published_max="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .body // ""' | \
            sed -n 's/^Android-version-code: \([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          version_code="$GITHUB_RUN_NUMBER"
          if [ "${published_max:-0}" -ge "$version_code" ]; then
            version_code=$((published_max + 1))
          fi
          if [ "$version_code" -lt 1 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "::error::Allocated versionCode is outside the Google Play range."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Android build
        if: steps.scope.outputs.required == 'true'
        uses: ./.github/actions/setup-android-build
        with:
          gradle-cache-disabled: "true"

      - name: Validate signing secrets
        if: steps.scope.outputs.required == 'true'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false
          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Validate tree for tag or manual release
        if: steps.scope.outputs.required == 'true' && env.VERIFIED_CI != 'true'
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :shared:desktopTest --no-daemon --stacktrace

      - name: Build release APK and AAB
        if: steps.scope.outputs.required == 'true'
        env:
          AISTEE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AISTEE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AISTEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AISTEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AISTEE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify and name release artifacts
        if: steps.scope.outputs.required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          grep -F "versionName='$RELEASE_VERSION'" <<< "$badging"
          grep -F "versionCode='$RELEASE_VERSION_CODE'" <<< "$badging"
          aab_files="$RUNNER_TEMP/aab-files.txt"
          unzip -Z1 "$aab" > "$aab_files"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$aab_files"
          jarsigner -verify "$aab" >/dev/null

          if [ "$RELEASE_KIND" = versioned ]; then
            cp "$apk" "dist/aistee_${RELEASE_VERSION}.apk"
            cp "$aab" "dist/aistee_${RELEASE_VERSION}.aab"
          else
            cp "$apk" dist/aistee.apk
            cp "$aab" dist/aistee.aab
          fi

      - name: Publish versioned release
        if: steps.release.outputs.kind == 'versioned'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A published release is never overwritten; a draft is a failed earlier attempt and is replaced.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"")"
          while read -r release_id is_draft; do
            [ -n "$release_id" ] || continue
            if [ "$is_draft" != true ]; then
              echo "::error::Release $tag already exists; versioned releases are never overwritten."
              exit 1
            fi
            echo "::warning::Deleting leftover draft release $release_id for $tag."
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done <<< "$existing"
          # The tag must still point at the commit that was built.
          tagged_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)"
          if [ "$tagged_sha" != "$BUILT_SHA" ]; then
            echo "::error::Tag $tag moved to $tagged_sha during the build (built $BUILT_SHA)."
            exit 1
          fi
          # Draft first, publish once both assets are attached.
          gh release create "$tag" \
            "dist/aistee_${RELEASE_VERSION}.apk" "dist/aistee_${RELEASE_VERSION}.aab" \
            --verify-tag --draft --latest=false \
            --title "Aistee ${RELEASE_VERSION}" --notes "Android-version-code: $RELEASE_VERSION_CODE" --generate-notes
          test "$(gh release view "$tag" --json assets --jq '.assets | length')" -eq 2
          gh release edit "$tag" --draft=false --latest=false

      - name: Publish rolling release
        if: steps.release.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          tag="aistee-latest"
          # A newer verified CI may have skipped an identical tree (including a revert).
          endpoint="repos/$GH_REPO/actions/workflows/android-ci.yml/runs"
          verified="$(gh api "$endpoint?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ -n "$verified" ]; then
            relation="$(gh api "repos/$GH_REPO/compare/$BUILT_SHA...$verified" --jq .status)"
            if [ "$relation" = ahead ]; then
              echo "A newer verified main run exists; skipping stale release."
              exit 0
            fi
            if [ "$relation" = diverged ]; then
              echo "::error::Verified main history diverged."
              exit 1
            fi
          fi
          # A slow older CI completion must not replace a newer published commit.
          lookup_err="$RUNNER_TEMP/rolling-ref-lookup.err"
          if published="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq 'if .draft then "" else (.id | tostring) end' 2>"$lookup_err")"; then
            if [ -n "$published" ]; then
              old_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)"
              relation="$(gh api "repos/$GH_REPO/compare/$old_sha...$BUILT_SHA" --jq .status)"
              if [ "$relation" = behind ]; then
                echo "A newer commit is already published; skipping stale release."
                exit 0
              fi
              if [ "$relation" != ahead ] && [ "$relation" != identical ]; then
                echo "::error::Rolling tag is not an ancestor of the verified build."
                exit 1
              fi
            fi
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            exit 1
          fi
          stage="aistee-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id=""
          old_id=""
          old_ref_sha=""
          old_deleted=false
          backup_dir="$RUNNER_TEMP/aistee-rolling-backup"
          old_notes="$RUNNER_TEMP/aistee-rolling-notes.md"
          old_name="Aistee · rolling"
          old_prerelease=false

          release_id_for_tag() {
            local wanted="$1" attempt output
            for attempt in 1 2 3; do
              if output="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$wanted\") | .id" 2>&1)" \
                && [ -n "$output" ]; then
                printf '%s\n' "$output"
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep "$attempt"
            done
            printf '%s\n' "$output" >&2
            return 1
          }

          wait_for_absent_release_and_tag() {
            local wanted="$1" deadline
            deadline=$((SECONDS + 60))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! gh api "repos/$GH_REPO/releases/tags/$wanted" >/dev/null 2>&1 \
                && ! gh api "repos/$GH_REPO/git/ref/tags/$wanted" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          cleanup_failed_promotion() {
            status=$?
            trap - EXIT
            set +e

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            echo "::warning::Rolling release promotion failed; cleaning staging state."

            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 || true
            else
              if staged_id="$(release_id_for_tag "$stage")" && [ -n "$staged_id" ]; then
                gh api --method DELETE "repos/$GH_REPO/releases/$staged_id" >/dev/null 2>&1 || true
              fi
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true

            if [ "$old_deleted" = true ]; then
              gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
              if [ -s "$backup_dir/aistee.apk" ] && [ -s "$backup_dir/aistee.aab" ]; then
                restore_args=(
                  "$tag"
                  "$backup_dir/aistee.apk"
                  "$backup_dir/aistee.aab"
                  --target "$old_ref_sha"
                  --title "$old_name"
                  --notes-file "$old_notes"
                  --latest
                )
                if [ "$old_prerelease" = true ]; then
                  restore_args+=(--prerelease)
                fi
                if ! gh release create "${restore_args[@]}" >/dev/null 2>&1; then
                  echo "::error::Could not restore the previous rolling release automatically."
                  echo "::error::Previous target was $old_ref_sha; use the saved main build if manual recovery is required."
                fi
              else
                echo "::error::Previous rolling assets were not preserved; manual recovery may be required."
              fi
            fi

            exit "$status"
          }
          trap cleanup_failed_promotion EXIT

          printf 'Signed Android builds from `%s`.\n\nRolling release. Assets are replaced after each successful build of `main`.\nApp version: `%s`.\n' \
            "$BUILT_SHA" "$RELEASE_VERSION" > release-notes.md
          printf '\nAndroid-version-code: %s\n' "$RELEASE_VERSION_CODE" >> release-notes.md

          gh release create "$stage" dist/aistee.apk dist/aistee.aab \
            --draft --target "$BUILT_SHA" \
            --title "Aistee · rolling" --notes-file release-notes.md
          release_id="$(release_id_for_tag "$stage")"
          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve the staged draft release."
            exit 1
          fi

          asset_count="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq 'length')"
          test "$asset_count" -eq 2

          # Only a 404 means "absent"; any other failure must not look like a missing release.
          lookup_err="$RUNNER_TEMP/rolling-lookup.err"
          if old_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>"$lookup_err")"; then
            if ! old_ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              echo "::error::Existing rolling release has no matching git tag."
              exit 1
            fi

            mkdir -p "$backup_dir"
            gh release download "$tag" --dir "$backup_dir" \
              --pattern 'aistee.apk' --pattern 'aistee.aab'
            test -s "$backup_dir/aistee.apk"
            test -s "$backup_dir/aistee.aab"
            gh api "repos/$GH_REPO/releases/$old_id" --jq '.body // ""' > "$old_notes"
            old_name="$(gh api "repos/$GH_REPO/releases/$old_id" --jq '.name // "Aistee · rolling"')"
            old_prerelease="$(gh api "repos/$GH_REPO/releases/$old_id" --jq '.prerelease')"

            old_deleted=true
            gh release delete "$tag" --cleanup-tag --yes
            if ! wait_for_absent_release_and_tag "$tag"; then
              echo "::error::Previous rolling release or tag did not disappear within 60 seconds."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            echo "::error::Could not look up the published rolling release."
            exit 1
          fi

          # Leftover drafts from earlier failed promotions still claim the tag name, which blocks the
          # PATCH below; the staged release carries a different tag name, so it is never matched.
          stale_ids="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id")"
          for stale_id in $stale_ids; do
            echo "::warning::Deleting stale draft release $stale_id for $tag."
            gh api --method DELETE "repos/$GH_REPO/releases/$stale_id"
          done

          # A tag with no published release (e.g. only a draft holds the name) would stay on its old
          # commit: promoting a release onto an existing tag reuses it and ignores target_commitish.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>"$lookup_err"; then
            echo "::warning::Removing orphaned tag $tag; no published release owns it."
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            if ! wait_for_absent_release_and_tag "$tag"; then
              echo "::error::Orphaned rolling tag did not disappear within 60 seconds."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            echo "::error::Could not look up the rolling tag."
            exit 1
          fi

          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$tag" -f target_commitish="$BUILT_SHA" \
            -f name='Aistee · rolling' -F draft=false -F prerelease=false \
            -f make_latest=true >/dev/null

          tag_synced=false
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if promoted_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)" \
              && [ "$promoted_sha" = "$BUILT_SHA" ]; then
              tag_synced=true
              break
            fi
            sleep 2
          done
          if [ "$tag_synced" != true ]; then
            echo "::error::Promoted rolling tag did not resolve to $BUILT_SHA within 60 seconds."
            exit 1
          fi

          final_asset_count="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets | length')"
          test "$final_asset_count" -eq 2
          trap - EXIT
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true
