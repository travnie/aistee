name: Set up Android build
description: Set up the JDK and Gradle used by Aistee Android/KMP workflows.

inputs:
  java-version:
    description: Temurin JDK version.
    required: false
    default: "21"
  gradle-cache-disabled:
    description: Disable Gradle dependency/build caching.
    required: false
    default: "false"
  robolectric-cache:
    description: Cache Robolectric android-all runtimes. Only for jobs that run JVM unit tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-disabled: ${{ inputs.gradle-cache-disabled }}

    # Robolectric fetches ~250 MB of android-all runtimes from Maven Central at test time, outside
    # the Gradle cache. Uncached, a registry hiccup (HTTP 403) fails every Robolectric test class.
    # Opt-in: emulator-only jobs never create the directory, release builds stay cache-free.
    - name: Resolve Robolectric runtime cache key
      id: robolectric
      if: inputs.robolectric-cache == 'true'
      shell: bash
      run: |
        version="$(sed -n 's/^robolectric = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
        # No match or a missing directory must not fail setup (bash runs with -e -o pipefail).
        sdks="$( (grep -rhoE 'sdk = \[[0-9, ]+\]' app/src/test app/src/testDebug 2>/dev/null || true) | sort -u | sha256sum | cut -c1-12)"
        echo "key=robolectric-android-all-${version:-unknown}-${sdks}" >> "$GITHUB_OUTPUT"

    - name: Cache Robolectric Android runtimes
      if: inputs.robolectric-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository/org/robolectric
        key: ${{ steps.robolectric.outputs.key }}
